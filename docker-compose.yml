# docker-compose.yml  (only the changed/added parts shown)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on: [postgres]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABRICKS_HOST: "${DATABRICKS_HOST}"
      DATABRICKS_HTTP_PATH: "${DATABRICKS_HTTP_PATH}"
      DATABRICKS_TOKEN: "${DATABRICKS_TOKEN}"
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on: [airflow-init]
    environment: *airflow-env
    ports: ["8080:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./lakehouse_transform:/opt/airflow/lakehouse_transform
    command: airflow webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on: [airflow-init]
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./lakehouse_transform:/opt/airflow/lakehouse_transform
    command: airflow scheduler

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]

  redpanda-console:
    image: redpandadata/console:latest
    depends_on: [redpanda]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8090:8080"]

volumes:
  postgres_data: